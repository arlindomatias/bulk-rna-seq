# Datasets whose DEGs are collected into results/all_degs.csv.
# The DEG criterion (padj or the unadjusted-p fallback, and the |log2FC| cutoff) is read from each
# project's results/de_summary.tsv, so it always matches what that project reports.
datasets:
  GSE295281:
    description: Mouse hippocampus, AC-T (doxorubicin + cyclophosphamide, then paclitaxel) vs saline
    report: ../bulk_rna_seq_tximport/reports/report.html
    project: ../bulk_rna_seq_tximport
    species: Mus musculus
    orgdb: org.Mm.eg.db
    gene_id_type: ENSEMBL
    method: DESeq2
    stat_type: Wald statistic
  GSE178812:
    description: Mouse hippocampus, doxorubicin vs vehicle
    report: ../analysis_from_geo_data/GSE178812/reports/report.html
    project: ../analysis_from_geo_data/GSE178812
    species: Mus musculus
    orgdb: org.Mm.eg.db
    gene_id_type: SYMBOL
    method: DESeq2
    stat_type: Wald statistic
  GSE236404:
    description: Rat dentate gyrus, doxorubicin vs vehicle
    report: ../analysis_from_geo_data/GSE236404/reports/report.html
    project: ../analysis_from_geo_data/GSE236404
    species: Rattus norvegicus
    orgdb: org.Rn.eg.db
    gene_id_type: ENSEMBL
    method: limma-trend
    stat_type: moderated t

# Cross-dataset gene key: every gene is matched by the Ensembl ID of its `key_species` gene. Genes of
# other species get the key of their 1:1 ortholog (Ensembl Compara `ortholog_one2one`); genes without one
# are not matched across species. Compara release 104 matches the GSE236404 rat IDs (Ensembl 104, rn6);
# the mouse IDs are stable GRCm39 IDs. Downloaded once by the `orthologs` rule into cache/compara/.
orthologs:
  key_species: mus_musculus
  release: 104
  url: https://ftp.ensembl.org/pub/release-104/tsv/ensembl-compara/homologies
  # Compara files are per species, and each species pair is in one file only (mouse–rat pairs are in the
  # mus_musculus files, not the rattus_norvegicus ones). Protein-coding and ncRNA gene trees.
  files:
    mus_musculus:
      - Compara.104.protein_default.homologies.tsv.gz
      - Compara.104.ncrna_default.homologies.tsv.gz

# Random-effects meta-analysis per gene (rule meta_random_effects): log2FoldChange and lfcSE of every
# dataset where the gene (key) was tested, combined with metafor::rma. DESeq2 genes with pvalue NA
# (Cook's outliers) are left out of that dataset.
meta:
  method: REML          # tau² estimator; DL is used when REML does not converge (column tau2_method)
  min_datasets: 2       # genes tested in fewer datasets are not meta-analysed
  padj: 0.05            # BH-adjusted p of the z test
  lfc: 0.5              # |pooled log2FC| for a meta DEG (same cutoff as the projects)
  forest_top_n: 20      # genes in the forest plot
