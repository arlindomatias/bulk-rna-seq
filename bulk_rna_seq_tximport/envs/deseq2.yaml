# Same package set as ../analysis_from_geo_data/envs/rna-seq.yaml, without GEOquery/readxl.
# Exact versions are in deseq2.linux-64.pin.txt (copied from the rna-seq lock file),
# which Snakemake uses instead of this file on linux-64.
name: deseq2
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5.3
  - r-ggplot2
  - r-readr
  - r-dplyr
  - r-tidyr
  - r-tibble
  - r-stringr
  - r-pheatmap
  - r-ggrepel
  - r-ggridges
  - r-ggforce
  - r-shadowtext
  - r-qqman
  - r-patchwork
  - r-igraph
  - r-ggtangle=0.1.4
  - bioconductor-deseq2
  - bioconductor-apeglm
  - bioconductor-enhancedvolcano
  - bioconductor-summarizedexperiment
  - bioconductor-clusterprofiler
  - bioconductor-enrichplot
  - bioconductor-dose
  - bioconductor-org.mm.eg.db
  - bioconductor-pathview
  - bioconductor-reactomepa
  - bioconductor-stringdb
