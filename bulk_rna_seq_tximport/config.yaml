# ============================================================
# Dataset configuration. For another dataset, replace this file
# (or pass another one with `snakemake --configfile other.yaml`).
# ============================================================

dataset: GSE295281
title: "AC-T vs Saline (hippocampus, 1 month after treatment)"

# Outputs of the ../raw_reads_processing project (tximport, gene level).
input:
  txi: ../raw_reads_processing/data/txi_gene.rds           # tximport list: counts, abundance, length
  samples: ../raw_reads_processing/data/samples.tsv        # one row per sample
  tx2gene: ../raw_reads_processing/data/tx2gene.tsv        # transcript_id, gene_id, gene_name, ...

# Gene identifiers of the count table: ENSEMBL (tximport projects) or SYMBOL (GEO symbol tables).
# Sets the GO keyType and the Entrez mapping for KEGG.
gene_id_type: ENSEMBL

samples:
  id_column: run              # must match colnames(txi$counts)
  condition_column: condition # column with the experimental group
  label_column: mouse_id      # short label for plots (null = use the id)

# Raw value in `condition_column` -> label used in the model.
# Labels must be valid R names (no hyphen), otherwise the DESeq2 coefficient name changes.
groups:
  labels:
    Saline: Saline
    AC-T: ACT
  reference: Saline
  treatment: ACT
  colors:
    Saline: "#3399FF"
    ACT: "#CC0000"

# Columns of samples.tsv added to the model before the group (~ cov1 + cov2 + group).
# Warning: in GSE295281 cage/batch (first digit of mouse_id) is nested in group and cannot be used.
covariates: []

# Sample ids removed from the analysis. E.g. [SRR33247678]
exclude_samples: []

filter:
  min_count: 10
  min_samples: null   # null = size of the smallest group

de:
  fit_type: local
  padj: 0.05          # also the `alpha` of DESeq2 results() (independent filtering)
  pvalue_fallback: 0.01  # used on the unadjusted p-value only when no gene has padj < padj (exploratory)
  lfc: 0.5            # minimum |log2FC| for a DEG

plots:
  heatmap_max_genes: 50
  # Genes shown in plots/marker_genes.png (normalized counts per sample).
  # Xist: every female should express it; Ddx3y: should be ~0.
  marker_genes: [Xist, Ddx3y, Gfap, Aif1, Mbp]

enrichment:
  organism_kegg: mmu
  orgdb: org.Mm.eg.db
  min_gs_size: 10
  max_gs_size: 800
  pvalue_cutoff: 0.05
  string_version: "12.0"
  string_species: 10090
  string_score: 700
  string_cache: cache/
  # Pathview maps and single-pathway GSEA plots: the `top_n` most significant pathways/terms
  # (an explicit list in pathview_pathways overrides the top N).
  pathview_pathways: []
  pathview_top_n: 3
  gsea_plot_top_n: 3

seed: 123
