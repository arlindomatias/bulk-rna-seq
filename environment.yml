name: rna-seq

channels:
  - conda-forge
  - bioconda

dependencies:
  # R
  - r-base=4.5.3

  # CRAN
  - r-ggplot2
  - r-readr
  - r-dplyr
  - r-tidyr
  - r-pheatmap
  - r-readxl
  - r-gridextra
  - r-shadowtext
  - r-qqman
  - r-ggridges
  - r-ggrepel
  - r-tibble
  - r-ggforce
  - r-stringr
  - r-patchwork
  - r-igraph
  - r-ggtangle=0.1.4
  
  # Bioconductor
  - bioconductor-deseq2
  - bioconductor-enhancedvolcano
  - bioconductor-geoquery
  - bioconductor-stringdb
  - bioconductor-enrichplot
  - bioconductor-clusterprofiler
  - bioconductor-dose
  - bioconductor-apeglm
  - bioconductor-org.mm.eg.db
  - bioconductor-pathview
  - bioconductor-reactomepa
  - bioconductor-summarizedexperiment

  # Verificar disponibilidade do pacote nos canais
  - r-ggtangle
